name: Daily Sales Dashboard Update

# ─── When to run ──────────────────────────────────────────────────────────────
on:
  schedule:
    # 11:00 UTC = 4:00 AM PDT (UTC-7, summer)
    # In PST this runs at 3:00 AM unless you intentionally change the cron.
    - cron: '0 11 * * *'

  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional date to backfill/correct (YYYY-MM-DD). Leave blank for yesterday.'
        required: false
        type: string
      replace_existing:
        description: 'Replace an existing dashboard date with the validated Google Sheet block'
        required: false
        default: false
        type: boolean

# The workflow needs write access only to commit the updated index.html.
permissions:
  contents: write

# Prevent two dashboard writers from racing each other.
concurrency:
  group: summerhill-daily-sales-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth pytz

      - name: Inject validated sales data
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_DATE: ${{ inputs.target_date }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: python scripts/daily_inject.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes — dashboard already up to date."
          else
            git commit -m "Auto-update dashboard: $(TZ='America/Los_Angeles' date +'%Y-%m-%d')"
            git push
            echo "Dashboard pushed successfully."
          fi
